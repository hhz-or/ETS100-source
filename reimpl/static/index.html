<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E听说 · 参考客户端</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232f7bff'/%3E%3Ctext x='32' y='44' font-size='34' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="app-window">
    <header class="titlebar">
      <div class="titlebar-left">
        <div class="logo">E</div>
        <div class="brand">
          <div class="brand-line">
            <span class="brand-name">讯飞 E 听说</span>
            <span class="brand-version">V5.7.9</span>
            <span class="badge badge-ref">参考客户端</span>
          </div>
          <div class="brand-sub">ETS 学生端 PC · Python 后端 + 本地 Web UI</div>
        </div>
      </div>
      <div class="titlebar-right">
        <div class="server-clock" id="serverClock" title="服务端时间（/system/time）">--:--:--</div>
        <button class="icon-btn" data-action="refresh" title="刷新当前页">
          <svg viewBox="0 0 24 24"><path d="M17.6 6.4A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.8-4.3L13 11h7V4l-2.4 2.4Z"/></svg>
        </button>
        <div class="user-chip" id="userChip" title="账号信息">
          <div class="avatar" id="userAvatar">?</div>
          <div class="user-meta">
            <div class="user-name" id="userName">未登录</div>
            <div class="user-sub" id="userSub">请先登录</div>
          </div>
        </div>
        <div class="window-controls" aria-hidden="true">
          <span class="win-btn" title="最小化（装饰）">–</span>
          <span class="win-btn" title="最大化（装饰）">▢</span>
          <span class="win-btn win-close" title="关闭（装饰，请关闭浏览器标签页）">×</span>
        </div>
      </div>
    </header>

    <div class="app-body">
      <aside class="sidebar" id="sidebar">
        <nav class="nav-group">
          <div class="nav-label">学习</div>
          <a class="nav-item" data-nav href="#/home" data-route="home">
            <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21H3V10.5Z"/></svg><span>学习中心</span>
          </a>
          <a class="nav-item" data-nav href="#/expand" data-route="expand">
            <svg viewBox="0 0 24 24"><path d="M4 4h7v7H4V4Zm9 0h7v7h-7V4ZM4 13h7v7H4v-7Zm9 0h7v7h-7v-7Z"/></svg><span>能力拓展</span>
          </a>
          <a class="nav-item" data-nav href="#/homework" data-route="homework">
            <svg viewBox="0 0 24 24"><path d="M5 3h14v18H5V3Zm3 4h8v2H8V7Zm0 4h8v2H8v-2Zm0 4h5v2H8v-2Z"/></svg><span>班级练习</span>
          </a>
          <a class="nav-item" data-nav href="#/mistakes" data-route="mistakes">
            <svg viewBox="0 0 24 24"><path d="M12 2 1 21h22L12 2Zm-1 7h2v6h-2V9Zm0 8h2v2h-2v-2Z"/></svg><span>错题本</span>
          </a>
          <a class="nav-item" data-nav href="#/words" data-route="words">
            <svg viewBox="0 0 24 24"><path d="M4 4h9a3 3 0 0 1 3 3v13H7a3 3 0 0 0-3 3V4Zm16 0h-2v16h2V4Z"/></svg><span>生词本</span>
          </a>
        </nav>
        <nav class="nav-group">
          <div class="nav-label">课程与账号</div>
          <a class="nav-item" data-nav href="#/courses" data-route="courses">
            <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4V5Zm2 2v10h12V7H6Zm2 2h8v2H8V9Zm0 4h8v2H8v-2Z"/></svg><span>同步课程</span>
          </a>
          <a class="nav-item" data-nav href="#/ecards" data-route="ecards">
            <svg viewBox="0 0 24 24"><path d="M3 6h18v12H3V6Zm2 2v8h14V8H5Zm1 5h5v2H6v-2Z"/></svg><span>我的 E 卡</span>
          </a>
          <a class="nav-item" data-nav href="#/config" data-route="config">
            <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm9 4-2.1-.7-.6-1.5 1.1-1.9-1.9-1.9-1.9 1.1-1.5-.6L14 4h-4l-.7 2.1-1.5.6L5.9 5.6 4 7.5l1.1 1.9-.6 1.5L2 12l.7 2.1.6 1.5L2.2 17.5l1.9 1.9 1.9-1.1 1.5.6L8 21h4l.7-2.1 1.5-.6 1.9 1.1 1.9-1.9-1.1-1.9.6-1.5L21 12Z"/></svg><span>系统配置</span>
          </a>
          <a class="nav-item" data-nav href="#/about" data-route="about">
            <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 4a2 2 0 1 1 0 4 2 2 0 0 1 0-4Zm-1 6h2v6h-2v-6Z"/></svg><span>关于 / 实现矩阵</span>
          </a>
        </nav>
        <div class="sidebar-foot">
          <div class="foot-badge">只读参考模式</div>
          <div class="foot-note">录音 / 评测 / 提交 / 上传<br>均未实现</div>
        </div>
      </aside>

      <main class="view" id="view" tabindex="-1">
        <div class="boot-loading">
          <div class="spinner"></div>
          <div>正在连接参考客户端…</div>
        </div>
      </main>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>
  <div class="modal-mask hidden" id="modal">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <div class="modal-title" id="modalTitle">提示</div>
        <button class="icon-btn" data-action="modal-close" title="关闭">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"><button class="btn" data-action="modal-close">知道了</button></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
