<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>E听说</title>
    <style>
      html, body, #app { height: 100%; }
      body { margin: 0; background: #f3f6fb; }
      #placeholderScreen {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        background: linear-gradient(135deg, #eef4ff 0%, #f8fbff 60%, #eefaf7 100%);
        font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; color: #30518a;
      }
      #placeholderScreen .ring {
        width: 42px; height: 42px; border-radius: 50%;
        border: 4px solid #d7e4ff; border-top-color: #2f6bff; animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="placeholderScreen">
      <div class="ring"></div>
      <div>程序正在启动中…</div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
